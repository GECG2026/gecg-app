<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GECG - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); padding: 40px; max-width: 400px; width: 100%; }
        .login-container h1 { font-size: 28px; font-weight: 700; color: #0f172a; text-align: center; }
        .login-container h1 i { color: #3b82f6; }
        .login-container p { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .login-container label { font-size: 12px; font-weight: 600; color: #475569; display: block; margin-bottom: 4px; }
        .login-container input { width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px; margin-bottom: 16px; font-size: 14px; transition: all 0.2s; }
        .login-container input:focus { border-color: #3b82f6; outline: none; }
        .login-container button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .login-container button:hover { background: #2563eb; }
        .login-container .error { color: #ef4444; font-size: 13px; text-align: center; display: none; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1><i class="fas fa-water"></i> GECG</h1>
        <p>Gestión de Control Guaicaipuro</p>

        <div id="loginForm">
            <label><i class="fas fa-user"></i> Usuario</label>
            <input type="text" id="username" placeholder="Ej: admin" />

            <label><i class="fas fa-lock"></i> Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña" />

            <button onclick="login()">Iniciar Sesión</button>
            <div id="errorMsg" class="error">❌ Usuario o contraseña incorrectos</div>
        </div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if (!username || !password) {
                errorMsg.textContent = '❌ Ingresa usuario y contraseña';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.error || 'Error al iniciar sesión');
                }

                const data = await res.json();
                sessionStorage.setItem('gecg_token', data.token);
                sessionStorage.setItem('gecg_user', JSON.stringify(data.user));

                // Redirigir al dashboard
                window.location.href = '/dashboard';

            } catch (error) {
                errorMsg.textContent = '❌ ' + error.message;
                errorMsg.style.display = 'block';
            }
        }

        // Enter para login
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
